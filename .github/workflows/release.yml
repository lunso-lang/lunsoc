name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QBE 1.3
        run: |
          curl -fsSL https://c9x.me/compile/release/qbe-1.3.tar.xz -o /tmp/qbe-1.3.tar.xz
          echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  /tmp/qbe-1.3.tar.xz" | sha256sum -c -
          tar -C /tmp -xf /tmp/qbe-1.3.tar.xz
          make -C /tmp/qbe-1.3 -j"$(nproc)"
          sudo make -C /tmp/qbe-1.3 install PREFIX=/usr/local

      - name: Download lunsoc v0.2
        run: |
          curl -fsSL https://github.com/lunso-lang/lunsoc/releases/download/v0.2/lunsoc-linux-x86_64 -o /tmp/lunsoc-v0.2
          chmod +x /tmp/lunsoc-v0.2

      - name: Build and test lunsoc
        run: make test LUNSO=/tmp/lunsoc-v0.2

      - name: Package self-hosted release binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="lunsoc-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}" dist/assets
          ./build/lunsoc --build src/main.lunso -o "dist/${PKG}/lunsoc"
          strip "dist/${PKG}/lunsoc"
          cp build/std-linux-x86_64.o "dist/${PKG}/std-linux-x86_64.o"
          cp -r std "dist/${PKG}/std"
          cp LICENSE README.md "dist/${PKG}/"
          cp "dist/${PKG}/lunsoc" "dist/assets/lunsoc-linux-x86_64"
          tar -C dist -czf "dist/assets/${PKG}.tar.gz" "${PKG}"
          (cd dist/assets && sha256sum "${PKG}.tar.gz" "lunsoc-linux-x86_64" > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/assets/* \
            --title "lunsoc ${GITHUB_REF_NAME}" \
            --generate-notes
