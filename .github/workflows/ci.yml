name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QBE 1.3
        run: |
          curl -fsSL https://c9x.me/compile/release/qbe-1.3.tar.xz -o /tmp/qbe-1.3.tar.xz
          echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  /tmp/qbe-1.3.tar.xz" | sha256sum -c -
          tar -C /tmp -xf /tmp/qbe-1.3.tar.xz
          make -C /tmp/qbe-1.3 -j"$(nproc)"
          sudo make -C /tmp/qbe-1.3 install PREFIX=/usr/local

      - name: Download lunsoc v0.1
        run: |
          curl -fsSL https://github.com/lunso-lang/lunsoc/releases/download/v0.1/lunsoc-linux-x86_64 -o /tmp/lunsoc-v0.1
          chmod +x /tmp/lunsoc-v0.1

      - name: Build and run test suite
        run: make test LUNSO=/tmp/lunsoc-v0.1

      - name: Build and run fuzzer
        run: make fuzz FUZZ_ITERS=50000 LUNSO=/tmp/lunsoc-v0.1
