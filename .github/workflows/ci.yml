name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: lunsoc

      - uses: actions/checkout@v4
        with:
          repository: lunso-lang/lunso-boot
          ref: v1.0
          path: lunso-boot

      - name: Install QBE
        run: |
          sudo apt-get update
          sudo apt-get install -y qbe

      - name: Download lunsoc v0.1
        run: |
          curl -fsSL https://github.com/lunso-lang/lunsoc/releases/download/v0.1/lunsoc-linux-x86_64 -o /tmp/lunsoc-v0.1
          chmod +x /tmp/lunsoc-v0.1

      - name: Build lunso-boot (std & differential tests)
        run: make -C lunso-boot all build/std-linux-x86_64.o

      - name: Build and run test suite with lunsoc v0.1
        run: make -C lunsoc test LUNSO=/tmp/lunsoc-v0.1

      - name: Build and run fuzzer
        run: make -C lunsoc fuzz FUZZ_ITERS=50000 LUNSO=/tmp/lunsoc-v0.1
